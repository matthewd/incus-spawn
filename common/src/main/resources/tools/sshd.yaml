name: sshd
description: OpenSSH server for remote access

packages:
  - openssh-server
  - nmap-ncat

run:
  - |
    install -d -m 0755 /etc/ssh/sshd_config.d
    cat > /etc/ssh/sshd_config.d/90-incus-spawn.conf <<'EOF'
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ChallengeResponseAuthentication no
    PubkeyAuthentication yes
    PermitRootLogin no
    AllowUsers agentuser
    AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    X11Forwarding no
    PermitTunnel no
    PermitUserEnvironment no
    ListenAddress 127.0.0.1
    EOF
  - ssh-keygen -A
  # Disable socket activation to avoid conflict with sshd.service — skip if
  # the unit doesn't exist (e.g. non-Fedora base images).
  - if systemctl cat sshd.socket >/dev/null 2>&1; then systemctl disable --now sshd.socket; fi
  - systemctl enable --now sshd
  - mkdir -p /home/agentuser/.ssh
  - touch /home/agentuser/.ssh/authorized_keys2
  - chown -R agentuser:agentuser /home/agentuser/.ssh
  - chmod 700 /home/agentuser/.ssh
  - chmod 600 /home/agentuser/.ssh/authorized_keys2

verify: sshd -t
ready: systemctl is-active sshd
